name:portfolio ci

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      -name: Set up Node.jobs
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

          -name: install dependencies
          run: npm install

          -name: run tests
          run: npm tests
          
          name: build project
          run: npm run build
          